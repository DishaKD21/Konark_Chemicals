services:
  devcontainer:
    profiles:
      - devcontainer
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - konark_node_modules:/app/node_modules
    command: sleep infinity

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: konark-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - konark_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- -H 0.0.0.0 -p 3000

  ide-deps:
    profiles:
      - ide
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "rm -rf node_modules && npm ci"

  web-prod:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: konark-web-prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

volumes:
  konark_node_modules:
